server {
    listen 80;
    server_name app.biaotech.dev;

    root /var/www/biaotech-frontend;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term cache for Vite hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# Após o primeiro deploy: sudo certbot --nginx -d app.biaotech.dev
