name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biaotech
          POSTGRES_PASSWORD: biaotech_password
          POSTGRES_DB: biaotech_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U biaotech -d biaotech_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: biaotech_super_secret_test_key
      JWT_EXPIRES_IN: 1h
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: biaotech
      DB_PASSWORD: biaotech_password
      DB_NAME: biaotech_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/aws-ec2-nginx-deploy

            git fetch origin main
            git reset --hard origin/main

            cd backend

            npm install
            npm run build

            pm2 restart backend --update-env || pm2 start dist/server.js --name backend

            pm2 save
            pm2 list

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/aws-ec2-nginx-deploy/frontend

            npm install

            VITE_API_URL=https://api.biaotech.dev/api npm run build

            sudo mkdir -p /var/www/biaotech-frontend
            sudo cp -r dist/* /var/www/biaotech-frontend/

            if [ ! -f /etc/nginx/conf.d/biaotech-frontend.conf ]; then
              sudo cp /home/ec2-user/aws-ec2-nginx-deploy/nginx/biaotech-frontend.conf /etc/nginx/conf.d/biaotech-frontend.conf
            fi

            sudo nginx -t
            sudo systemctl reload nginx