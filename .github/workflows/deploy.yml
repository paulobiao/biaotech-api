name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biaotech
          POSTGRES_PASSWORD: biaotech_password
          POSTGRES_DB: biaotech_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U biaotech -d biaotech_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: biaotech_super_secret_test_key
      JWT_EXPIRES_IN: 1h
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: biaotech
      DB_PASSWORD: biaotech_password
      DB_NAME: biaotech_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/aws-ec2-nginx-deploy

            git fetch origin main
            git reset --hard origin/main

            cd backend

            npm install

            pm2 restart backend --update-env || pm2 start server.js --name backend

            pm2 save
            pm2 list